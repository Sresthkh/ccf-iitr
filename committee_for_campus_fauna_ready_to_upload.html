    const CuteCharacterSVG = ({ characterId, state, frame }) => {
      const isFleeing = state === 'fleeing';
      const isWelcoming = state === 'welcoming';
      const isResting = state === 'resting';

      const bounce = isResting
        ? Math.sin(frame * 0.08) * 1.5
        : Math.abs(Math.sin(frame * (isFleeing ? 0.45 : 0.22))) * (isFleeing ? -10 : -5);

        c.y = welcomeY - 25;

      const startRoamingNow = () => {

      useEffect(() => {
        const onMove = (e) => {
          mouseRef.current = { x: e.clientX, y: e.clientY };
        };
        const onLeave = () => {
          mouseRef.current = { x: -9999, y: -9999 };
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseleave', onLeave);
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseleave', onLeave);
        };
      }, []);

      useEffect(() => {
        if (!companionEnabled) return;

        let rafId;
        const ESCAPE_DISTANCE = 155;

        const stepSimulation = () => {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const c = companionRef.current;
          const mx = mouseRef.current.x;
          const my = mouseRef.current.y;

          c.frame += 1;

          if (c.state === 'welcoming') {
            c.y += (c.targetY - c.y) * 0.12;
            c.welcomeTimer -= 1;

            if (c.welcomeTimer <= 0) {
              c.state = 'roaming';
              c.speech = null;
              c.targetX = 140 + Math.random() * Math.max(w - 280, 200);
              c.targetY = 170 + Math.random() * Math.max(h - 300, 200);
            }

            setTick((t) => (t + 1) % 10000);
            rafId = requestAnimationFrame(stepSimulation);
            return;
          }

          const dxCursor = c.x - mx;
          const dyCursor = c.y - my;
          const distCursor = Math.hypot(dxCursor, dyCursor);

          if (distCursor < ESCAPE_DISTANCE && distCursor > 1) {
            if (c.state !== 'fleeing') {
              const fleeLines = currentCompanion.fleeTexts;
              c.speech = fleeLines[Math.floor(Math.random() * fleeLines.length)];
            }
            c.state = 'fleeing';
            c.biscuitX = null;
            c.biscuitY = null;
            c.fleeCooldown = 52;

            const normX = dxCursor / distCursor;
            const normY = dyCursor / distCursor;
            const rawTargetX = c.x + normX * 290 + (Math.random() - 0.5) * 120;
            const rawTargetY = c.y + normY * 220 + (Math.random() - 0.5) * 120;

            c.targetX = Math.min(Math.max(rawTargetX, 110), w - 120);
            c.targetY = Math.min(Math.max(rawTargetY, 135), h - 125);
          } else if (c.fleeCooldown > 0) {
            c.fleeCooldown -= 1;
            if (c.fleeCooldown === 0) {
              c.state = 'roaming';
              c.speech = null;
            }
          }

          const destX = c.biscuitX !== null ? c.biscuitX : c.targetX;
          const destY = c.biscuitY !== null ? c.biscuitY : c.targetY;
          const dx = destX - c.x;
          const dy = destY - c.y;
          const distToDest = Math.hypot(dx, dy);

          if (distToDest > 10) {
            const speed = c.state === 'fleeing' ? 5.6 : c.biscuitX !== null ? 3.2 : 1.45;
            c.vx = (dx / distToDest) * speed;
            c.vy = (dy / distToDest) * speed;
            c.x += c.vx;
            c.y += c.vy;

            if (Math.abs(c.vx) > 0.15) {
              c.facingRight = c.vx > 0;
            }
          } else {
            c.vx = 0;
            c.vy = 0;

            if (c.biscuitX !== null) {
              c.biscuitX = null;
              c.biscuitY = null;
              c.state = 'resting';
              c.idlePauseTimer = 110;
              c.speech = 'Yum!! Thank you for the campus treat! ♥';
            } else if (c.state !== 'resting') {
              c.state = 'resting';
              c.idlePauseTimer = 75 + Math.floor(Math.random() * 80);
              if (Math.random() < 0.45) {
                const thoughts = currentCompanion.idleThoughts;

                c.speech = null;
                c.targetX = 110 + Math.random() * Math.max(w - 230, 180);
                c.targetY = 140 + Math.random() * Math.max(h - 260, 180);
              }
            }
          }

          c.x = Math.min(Math.max(c.x, 95), w - 105);
          c.y = Math.min(Math.max(c.y, 125), h - 110);

          setTick((t) => (t + 1) % 10000);
          rafId = requestAnimationFrame(stepSimulation);
        };

        rafId = requestAnimationFrame(stepSimulation);
        return () => cancelAnimationFrame(rafId);
